<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by the `--base-href` value given to
    `flutter build` (e.g. /AgosAlert/ on GitHub Pages).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AgosAlert: live weather, flood outlook, and emergency help for Mabalacat City, Pampanga.">
  <meta name="theme-color" content="#05060C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AgosAlert">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    SPEED: start every download right away, all at the same time.
    Without these, the browser only discovers the app code, fonts, and
    asset lists one step after another as Flutter starts up.
  -->
  <!-- Flutter's drawing engine (CanvasKit) comes from Google's CDN. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <!-- The app itself. -->
  <link rel="preload" href="main.dart.js" as="script">
  <!-- Lists of fonts/images, and the fonts (normally fetched only after
       the engine has started). -->
  <link rel="preload" href="assets/AssetManifest.bin.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/packages/cupertino_icons/assets/CupertinoIcons.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/AgosIcons.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-SemiBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-Bold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-ExtraBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/InterDisplay-Bold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/InterDisplay-ExtraBold.ttf" as="fetch" crossorigin>

  <title>AgosAlert · Mabalacat City</title>
  <link rel="manifest" href="manifest.json">

  <!--
    LOADING SCREEN: the app icon (the A with its wave), and the A fills with
    blue water from the bottom as the app loads (the water is clipped to
    the A's shape). The mark's paths between LOGO:START / LOGO:END are
    written by tools/make_logo.py; don't edit them by hand. Plain HTML/CSS, so it shows
    instantly while Flutter downloads. flutter_bootstrap.js raises the water
    at each loading step and fades this out once the app has drawn its
    first frame. Follows ?theme=light (set by the landing page).
  -->
  <script>
    if (/[?&]theme=light\b/.test(location.search)) document.documentElement.className = 'light';
  </script>
  <style>
    @font-face { font-family: Inter; font-weight: 800; font-display: block;
      src: url('assets/assets/fonts/Inter-ExtraBold.ttf'); }
    @font-face { font-family: Inter; font-weight: 400; font-display: block;
      src: url('assets/assets/fonts/Inter-Regular.ttf'); }
    :root { --bg: #05060C; --text: #F5F5F7; --muted: #9A9AA1; --line: rgba(255,255,255,.14); }
    :root.light { --bg: #F2F3F6; --text: #1D1D1F; --muted: #6E6E73; --line: rgba(0,0,0,.1); }
    html, body { margin: 0; height: 100%; background: var(--bg); }

    #loader {
      position: fixed; inset: 0; z-index: 9999; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .5s ease, visibility .5s ease;
    }
    #loader.done { opacity: 0; visibility: hidden; }
    /* Dark: the landing page's night sky (landing.css .sky), stars drawn once, still. */
    :root:not(.light) #loader {
      background:
        radial-gradient(ellipse 70% 55% at 78% -5%, rgba(28, 61, 114, .55), transparent 70%),
        radial-gradient(ellipse 60% 50% at -5% 105%, rgba(22, 25, 74, .55), transparent 70%),
        linear-gradient(180deg, #070a1c 0%, var(--bg) 60%);
    }
    .stars { position: absolute; left: 0; top: 0; width: 1px; height: 1px; border-radius: 50%; }
    :root.light .stars { display: none; }

    /* Thin progress bar along the top */
    .progress { position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 3; }
    .progress span {
      display: block; height: 100%; width: 8%; background: #0A84FF;
      transition: width .8s cubic-bezier(.22,1,.36,1);
    }

    .page {
      position: relative; z-index: 2; width: 100%; max-width: 420px;
      padding: 24px; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
    }
    /* The app icon tile (same shape as tools/make_logo.py's tile_svg). */
    :root { --tile: #000; --ink: #fff; --tile-edge: rgba(255,255,255,.14); }
    :root.light { --tile: #fff; --ink: #1D1D1F; --tile-edge: rgba(0,0,0,.08); }
    .badge {
      position: relative; width: 128px; height: 128px; border-radius: 28.7px;
      background: var(--tile); overflow: hidden;
      box-shadow: 0 0 0 1px var(--tile-edge), 0 18px 40px -12px rgba(0,0,0,.55);
      animation: bob 3.2s ease-in-out infinite;
    }
    :root.light .badge { box-shadow: 0 0 0 1px var(--tile-edge), 0 18px 40px -14px rgba(0,0,0,.22); }
    /* The mark is drawn on a 256 grid; this box is that grid, scaled down. */
    .art { position: absolute; left: 0; top: 0; width: 256px; height: 256px;
      transform: scale(.5); transform-origin: 0 0; }
    .art svg { position: absolute; inset: 0; width: 256px; height: 256px; }
    .ink { fill: var(--ink); }
    /* The water inside the A: cut to the A's shape by #aShape. */
    .drop { position: absolute; inset: 0; clip-path: url(#aShape); overflow: hidden; }
    /* The water. It starts fully below the mark (top: 100%);
       flutter_bootstrap.js lowers `top` at each step, which raises it.
       200% wide so it can slide sideways forever without its edge showing. */
    .drop .fill {
      position: absolute; left: -50%; width: 200%; height: 110%;
      top: 100%;
      transition: top 1.2s cubic-bezier(.22,1,.36,1);
    }
    .drop .fill svg { position: absolute; top: -7px; width: 100%; height: 8px; }
    .drop .fill .body { position: absolute; top: 0; bottom: 0; width: 100%;
      background: linear-gradient(#3FA2FF, #0A84FF); }
    .drop .fill.back { opacity: .5; animation: slide 2.6s linear infinite reverse; }
    .drop .fill.front { animation: slide 1.9s linear infinite; }

    .brand {
      margin-top: 22px; font-size: 26px; font-weight: 800; letter-spacing: -.045em; color: var(--text);
    }
    .brand .dot { color: #0A84FF; }

    .bubble {
      position: absolute; bottom: 90px; border-radius: 50%; z-index: 1;
      border: 1.5px solid var(--line);
      animation: rise linear infinite; opacity: 0;
    }
    .status {
      margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .status .dot { width: 6px; height: 6px; border-radius: 50%; background: #0A84FF;
      animation: pulse 1.2s ease-in-out infinite; }

    /* Faint water lines at the bottom */
    .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 1; }
    .waves svg { position: absolute; bottom: 0; width: 200%; height: 100%; }
    .waves path { fill: none; stroke: var(--line); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .waves .w1 { animation: slide 14s linear infinite; }
    .waves .w2 { animation: slide 10s linear infinite reverse; }
    .waves .w3 { animation: slide 7s linear infinite; height: 70%; }

    /* The endless-wave trick: each wave picture is 200% wide and its
       second half is an exact copy of its first half. Sliding it left by
       half its width (-50%) ends on a frame that looks identical to the
       start, so when the animation jumps back to 0 and repeats, you can't
       see the jump. `reverse` on some layers makes them move the other way. */
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    /* Bubble: starts small and invisible, fades in, floats up 55% of the
       screen height (55vh) while growing, and fades out at the top. */
    @keyframes rise {
      0% { transform: translateY(0) scale(.6); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-55vh) scale(1); opacity: 0; }
    }

    /* Respect "reduce motion" accessibility settings */
    @media (prefers-reduced-motion: reduce) {
      #loader *, #loader *::before, #loader *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite" aria-label="Loading AgosAlert">
    <div class="progress"><span id="loaderBar"></span></div>
    <div class="stars" aria-hidden="true"></div>
    <script>
      // Same recipe as the landing page's stars (landing.js starLayer), one still layer.
      (function () {
        var w = Math.max(screen.width, innerWidth), h = Math.max(screen.height, innerHeight), out = [];
        for (var i = 0; i < 300; i++) {
          var c = Math.random() < 0.12 ? '120,180,255' : Math.random() < 0.08 ? '160,158,255' : '255,255,255';
          out.push(Math.round(Math.random() * w) + 'px ' + Math.round(Math.random() * h) + 'px rgba(' + c + ',' + (0.25 + Math.random() * 0.6).toFixed(2) + ')');
        }
        document.querySelector('#loader .stars').style.boxShadow = out.join(',');
      })();
    </script>

M200.08 187.53 210.97 216.35Q213.31 222.55 210.58 228.59Q207.85 234.63 201.65 236.97Q195.45 239.31 189.41 236.58Q183.37 233.85 181.03 227.65L170.34 199.35Q184.93 197.19 200.08 187.53Z"/></clipPath></defs></svg>
    <!-- LOGO:END -->

    <div class="page">
      <div class="badge">
        <div class="art">
          <svg viewBox="0 0 256 256" aria-hidden="true"><use href="#agInk" class="ink"/></svg>
          <div class="drop">
            <div class="fill back" id="fillBack">
              <svg viewBox="0 0 200 16" preserveAspectRatio="none"><path d="M0 8 Q25 0 50 8 T100 8 T150 8 T200 8 V16 H0Z" fill="#3FA2FF"/></svg>
              <div class="body"></div>

            <div class="fill front" id="fillFront">
              <svg viewBox="0 0 200 16" preserveAspectRatio="none"><path d="M0 8 Q25 16 50 8 T100 8 T150 8 T200 8 V16 H0Z" fill="#3FA2FF"/></svg>
              <div class="body"></div>
            </div>
          </div>
          <svg viewBox="0 0 256 256" aria-hidden="true"><use href="#agWave" fill="#0A84FF"/></svg>
        </div>
      </div>
      <div class="brand">agosalert<span class="dot">.</span></div>
      <div class="status"><span class="dot"></span><span id="loaderStatus">Checking the waters…</span></div>
    </div>

    <div class="bubble" style="left:18%; width:10px; height:10px; animation-duration:6s; animation-delay:.2s"></div>
    <div class="bubble" style="left:32%; width:6px;  height:6px;  animation-duration:5s; animation-delay:1.6s"></div>
    <div class="bubble" style="left:58%; width:12px; height:12px; animation-duration:7s; animation-delay:.8s"></div>
    <div class="bubble" style="left:74%; width:7px;  height:7px;  animation-duration:5.5s; animation-delay:2.4s"></div>
    <div class="bubble" style="left:88%; width:9px;  height:9px;  animation-duration:6.5s; animation-delay:3.2s"></div>

  </div>
